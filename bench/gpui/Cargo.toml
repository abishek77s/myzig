[package]
name = "gpui-bench"
version = "0.1.0"
edition = "2024"
publish = false

# bench/run.sh clones gpui-fast at the commit it pins into .cache/gpui-fast.
[dependencies]
gpui = { path = "../.cache/gpui-fast/crates/gpui", default-features = false }
gpui_platform = { path = "../.cache/gpui-fast/crates/gpui_platform", default-features = false, features = ["font-kit", "x11"] }

# gpui-fast's own release profile, stripped.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.build-override]
codegen-units = 16

# gpui-fast's patches of crates.io.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[workspace]
